<!DOCTYPE html>
<html style="width:100%;height:100%;background:#07060f;">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eaglercraft 1.5.2</title>

</head>
<body style="margin:0;width:100vw;height:100vh;font-family:sans-serif;overflow:hidden;" id="game_frame">
<div id="gsl" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#07060f;color:#cfd3ff;font-family:system-ui,sans-serif;z-index:9">
  <div style="font-size:22px;font-weight:700;letter-spacing:1px">Eaglercraft 1.5.2</div>
  <div style="width:min(360px,80vw);height:10px;border-radius:6px;background:#1b1a33;overflow:hidden"><div id="gsl-bar" style="height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#22d3ee);transition:width .2s"></div></div>
  <div id="gsl-txt" style="font-size:14px;opacity:.8">Starting download...</div>
  <div style="font-size:12px;opacity:.5">First load downloads the game once. After that it opens from cache.</div>
</div>
<script>
(function () {
  var BASES = ["https://raw.githubusercontent.com/aadamyahyakamran-commits/Greatsword-V3/main/games/", "https://raw.githubusercontent.com/aadamyahyakamran-commits/Greatsword-V3/claude/vigilant-turing-qncum6/games/"], DIR = "eagler/1.5/", FILES = {"classes.js": 4331666, "assets.epk": 6509604, "sp_worker.js": 3506691};
  var bar = document.getElementById("gsl-bar"), txt = document.getElementById("gsl-txt");
  var got = {}, total = 14347961;
  function progress() {
    var n = 0; for (var k in got) n += got[k];
    var p = Math.min(100, n / total * 100);
    bar.style.width = p + "%";
    txt.textContent = p >= 100 ? "Starting..." : "Downloading " + Math.floor(p) + "%";
  }
  function stream(res, name) {
    if (!res.body || !res.body.getReader) return res.blob();
    var reader = res.body.getReader(), parts = [], n = 0;
    return (function pump() {
      return reader.read().then(function (r) {
        if (r.done) return new Blob(parts);
        parts.push(r.value); n += r.value.length; got[name] = n; progress();
        return pump();
      });
    })();
  }
  function fromNet(name, i) {
    i = i || 0;
    return fetch(BASES[i] + DIR + name).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return stream(res, name);
    }).catch(function (e) {
      if (i + 1 < BASES.length) return fromNet(name, i + 1);
      throw e;
    });
  }
  function load(name) {
    var key = "https://greatsword.cache/" + DIR + name;
    var store = null;
    try { store = window.caches ? caches.open("greatsword-v1") : null; } catch (e) {}
    if (!store) return fromNet(name);
    return store.then(function (c) {
      return c.match(key).then(function (hit) {
        if (hit) return hit.blob().then(function (b) { got[name] = FILES[name]; progress(); return b; });
        return fromNet(name).then(function (b) {
          c.put(key, new Response(b)).catch(function () {});
          return b;
        });
      });
    }).catch(function () { return fromNet(name); });
  }
  var names = Object.keys(FILES);
  Promise.all(names.map(load)).then(function (blobs) {
    var url = {};
    names.forEach(function (n, i) {
      var type = /\.js$/.test(n) ? "text/javascript" : "application/octet-stream";
      url[n] = URL.createObjectURL(blobs[i].type === type ? blobs[i] : new Blob([blobs[i]], { type: type }));
    });
    window.__relayId = Math.floor(Math.random() * 3);
    window.eaglercraftOpts = {
			container: "game_frame", assetsURI: url["assets.epk"],
			serverWorkerURI: url["sp_worker.js"],
			worldsFolder: "TEST", mainMenu: { splashes: [
			"Darviglet!", "eaglerenophile!", "You Eagler!", "Yeeeeeee!", "yeee",
			"EEEEEEEEE!", "You Darvig!", "You Vigg!", ":>", "|>", "You Yumpster!"
			]}, worldsFolder: "OFFLINE", relays: [
			{ addr: "wss://relay.deev.is/", name: "lax1dude relay #1", primary: (window.__relayId) == 0 },
	        { addr: "wss://relay.lax1dude.net/", name: "lax1dude relay #2", primary: (window.__relayId) == 1 },
	        { addr: "wss://relay.shhnowisnottheti.me/", name: "ayunami relay #1", primary: (window.__relayId) == 2 } ]
		};
    startClient(url["classes.js"], function () { main(); });
  }).catch(function (e) {
    txt.textContent = "Download failed (" + e.message + "). Press Reload to try again.";
    bar.style.background = "#ff5c7a";
  });
  function startClient(src, done) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = function () { var l = document.getElementById("gsl"); if (l) l.remove(); done(); };
    s.onerror = function () { txt.textContent = "Couldn't start the game."; };
    document.head.appendChild(s);
  }
  window.__gsStartClient = startClient;
})();
</script>
</body>
</html>
